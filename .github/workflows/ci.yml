name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-api.txt', 'requirements-ingestion.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements-api.txt
          pip install -r requirements-ingestion.txt
          pip install pytest pytest-cov flake8 black isort bandit

      - name: Lint (flake8)
        run: flake8 . --max-line-length=120 --exclude=.venv,__pycache__,data,docs

      - name: Format check (black)
        run: black . --check --line-length=120 --exclude='/(\.venv|data|docs)/'

      - name: Import order check (isort)
        run: isort . --check-only --profile=black --skip=data --skip=docs

      - name: Security scan (bandit)
        run: bandit -r serving ingestion retrieval embedding_service flows monitoring -ll

      - name: Unit tests
        run: pytest tests/ -v --cov=. --cov-report=xml
        env:
          GROQ_API_KEY: test-key
          COHERE_API_KEY: test-key
          POSTGRES_HOST: localhost
          POSTGRES_USER: fincomply
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: fincomply_db
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          ADMIN_PASSWORD: testpassword

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t fincomply-api .

      - name: Build ingestion image
        run: docker build -f docker/Dockerfile.ingestion -t fincomply-ingestion .

      - name: Build embedding image
        run: docker build -f docker/Dockerfile.embedding -t fincomply-embedding .