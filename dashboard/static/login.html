<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinComply — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020817;
  --glass: rgba(8,20,45,0.7);
  --border: rgba(56,189,248,0.15);
  --border-2: rgba(56,189,248,0.35);
  --cyan: #38bdf8;
  --cyan-2: #7dd3fc;
  --blue: #3b82f6;
  --text: #f0f9ff;
  --text-2: #94a3b8;
  --text-3: #475569;
  --red: #f87171;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

body {
  background: var(--bg);
  font-family: var(--sans);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 20% 20%, rgba(56,189,248,0.1) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 80%, rgba(59,130,246,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(129,140,248,0.05) 0%, transparent 70%);
  pointer-events: none;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(56,189,248,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

.login-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  padding: 20px;
}

.login-card {
  background: var(--glass);
  backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 80px rgba(56,189,248,0.05);
}

.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(56,189,248,0.6), transparent);
}

.brand-wrap {
  text-align: center;
  margin-bottom: 36px;
}
.brand-icon {
  font-size: 36px;
  margin-bottom: 12px;
  display: block;
}
.brand-name {
  font-size: 26px;
  font-weight: 700;
  background: linear-gradient(135deg, #fff 30%, var(--cyan-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}
.brand-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--cyan);
  opacity: 0.7;
  margin-top: 6px;
  letter-spacing: 1px;
}

.field { margin-bottom: 16px; }
.field-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-3);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
  display: block;
}
.field-input {
  width: 100%;
  background: rgba(14,30,60,0.5);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  padding: 13px 16px;
  outline: none;
  transition: all 0.2s;
}
.field-input:focus {
  border-color: var(--border-2);
  box-shadow: 0 0 0 3px rgba(56,189,248,0.08), 0 0 20px rgba(56,189,248,0.05);
}
.field-input::placeholder { color: var(--text-3); }

.btn-login {
  width: 100%;
  margin-top: 24px;
  padding: 14px;
  background: linear-gradient(135deg, var(--cyan), var(--blue));
  color: #000;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 0 20px rgba(56,189,248,0.3), 0 4px 15px rgba(56,189,248,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-login:hover {
  box-shadow: 0 0 30px rgba(56,189,248,0.5), 0 4px 20px rgba(56,189,248,0.3);
  transform: translateY(-1px);
}
.btn-login:active { transform: translateY(0); }
.btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.error-msg {
  display: none;
  background: rgba(248,113,113,0.1);
  border: 1px solid rgba(248,113,113,0.2);
  border-radius: 8px;
  padding: 10px 14px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--red);
  margin-top: 14px;
  text-align: center;
}
.error-msg.show { display: block; }

.login-footer {
  text-align: center;
  margin-top: 28px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-3);
  opacity: 0.5;
  letter-spacing: 0.5px;
  line-height: 1.8;
}

.spin {
  width: 14px; height: 14px;
  border: 2px solid rgba(0,0,0,0.3);
  border-top-color: #000;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand-wrap">
      <span class="brand-icon">⚖</span>
      <div class="brand-name">FinComply</div>
      <div class="brand-sub">Financial Compliance Intelligence</div>
    </div>

    <div class="field">
      <label class="field-label" for="username">Username</label>
      <input class="field-input" id="username" type="text" placeholder="Enter username" autocomplete="username">
    </div>

    <div class="field">
      <label class="field-label" for="password">Password</label>
      <input class="field-input" id="password" type="password" placeholder="Enter password" autocomplete="current-password">
    </div>

    <button class="btn-login" id="login-btn" onclick="doLogin()">
      <div class="spin" id="spin"></div>
      <span id="btn-text">⟶ Sign In</span>
    </button>

    <div class="error-msg" id="error-msg">Invalid username or password</div>

    <div class="login-footer">
      FinComply v1.0 · Compliance Intelligence Platform<br>
      AML · BOT · SEC Regulatory Documents
    </div>
  </div>
</div>

<script>
const API = '/api';

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    showError('Please enter username and password');
    return;
  }

  const btn = document.getElementById('login-btn');
  const spin = document.getElementById('spin');
  const btnText = document.getElementById('btn-text');
  const errorMsg = document.getElementById('error-msg');

  btn.disabled = true;
  spin.style.display = 'block';
  btnText.textContent = 'Signing in...';
  errorMsg.classList.remove('show');

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    const data = await res.json();

    if (res.ok) {
      // Store token
      localStorage.setItem('fc_token', data.access_token);
      localStorage.setItem('fc_user', JSON.stringify({
        username: data.username,
        role: data.role,
      }));
      // Redirect to dashboard
      window.location.href = '/';
    } else {
      showError(data.detail || 'Login failed');
    }
  } catch(e) {
    showError('Connection error. Please try again.');
  } finally {
    btn.disabled = false;
    spin.style.display = 'none';
    btnText.textContent = '⟶ Sign In';
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('show');
}

// Enter to login
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// Redirect if already logged in
const token = localStorage.getItem('fc_token');
if (token) {
  fetch(`${API}/auth/me`, {
    headers: { 'Authorization': `Bearer ${token}` }
  }).then(r => {
    if (r.ok) window.location.href = '/';
    else localStorage.removeItem('fc_token');
  }).catch(() => {});
}
</script>
</body>
</html>
